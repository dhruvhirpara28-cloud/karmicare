<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture frame</title>
<!-- Fixture only: Orca's tab draws a blank frame after a page scrolls itself, but a page that scrolls
     inside an iframe paints. frame.html?src=<fixture page with ?at= or ?y=> fills the viewport. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fffbf6; }
  iframe { display: block; width: 100vw; height: 100vh; border: 0; }
</style>
<iframe id="f" title="Fixture page"></iframe>
<script>
  document.getElementById('f').src = new URLSearchParams(location.search).get('src') || 'site/index.html';
</script>
</html>
